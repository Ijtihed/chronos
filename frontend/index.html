<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHRONOS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Georgia, "Times New Roman", serif;
            background: #0e0e0e;
            color: #c8b88a;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #narrative {
            flex: 1;
            overflow-y: auto;
            padding: 40px 24px 28px;
            max-width: 680px;
            margin: 0 auto;
            width: 100%;
            line-height: 1.8;
        }

        .intro p { margin-bottom: 14px; }

        .turn-block {
            margin-bottom: 28px;
            padding-top: 20px;
            border-top: 1px solid #1a1816;
        }

        .year-mark {
            font-size: 0.7em;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #3a3428;
            margin-bottom: 8px;
        }

        .player-line {
            font-style: italic;
            color: #706850;
            margin-bottom: 12px;
            font-size: 0.9em;
        }

        .narration {
            margin-bottom: 14px;
            color: #b8a880;
        }

        .npc-block {
            margin-bottom: 14px;
            padding: 14px 18px;
            border-left: 2px solid #2a2620;
            background: #12110f;
        }

        .npc-label {
            font-size: 0.72em;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #585040;
            margin-bottom: 5px;
        }

        .npc-voice { line-height: 1.8; color: #c0b088; }

        .death-block {
            margin: 30px 0;
            padding: 24px;
            border-top: 1px solid #2a2018;
            border-bottom: 1px solid #2a2018;
            text-align: center;
        }
        .death-block p { color: #907860; line-height: 1.9; }

        .erasure-block {
            margin: 50px auto;
            max-width: 480px;
            text-align: center;
            padding: 30px;
        }
        .erasure-block p { color: #585040; line-height: 2.2; font-style: italic; }

        #input-bar {
            padding: 14px 24px;
            border-top: 1px solid #1a1816;
            display: flex;
            gap: 8px;
            max-width: 680px;
            margin: 0 auto;
            width: 100%;
        }

        #player-input {
            flex: 1;
            background: #141412;
            border: 1px solid #1e1c18;
            color: #c8b88a;
            padding: 12px 16px;
            font-family: Georgia, serif;
            font-size: 0.95em;
            border-radius: 2px;
            outline: none;
        }
        #player-input:focus { border-color: #3a3428; }
        #player-input::placeholder { color: #282420; }
        #player-input:disabled { opacity: 0.3; }

        #act-btn {
            background: none;
            border: 1px solid #1e1c18;
            color: #585040;
            padding: 12px 18px;
            font-family: Georgia, serif;
            font-size: 0.95em;
            cursor: pointer;
            border-radius: 2px;
        }
        #act-btn:hover { border-color: #3a3428; color: #a09070; }
        #act-btn:disabled { opacity: 0.2; cursor: not-allowed; }

        .loading-text { color: #3a3428; font-style: italic; }
        .error-text { color: #805040; }

        strong { color: #d0c090; font-weight: 600; }

        #start-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            gap: 24px;
            padding: 40px;
        }
        #start-screen h2 {
            font-weight: 400;
            font-size: 1.1em;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #706850;
        }
        #start-screen .begin-btn {
            background: none;
            border: 1px solid #282420;
            color: #a09070;
            padding: 10px 28px;
            font-family: Georgia, serif;
            font-size: 0.9em;
            cursor: pointer;
            border-radius: 2px;
            letter-spacing: 0.1em;
        }
        #start-screen .begin-btn:hover { border-color: #484030; }

        .hidden { display: none; }

        #map-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background: #0a0a0a;
        }

        .map-hint {
            position: fixed;
            bottom: 16px;
            right: 16px;
            z-index: 11;
            font-size: 0.7em;
            color: #2a2420;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    <div id="start-screen">
        <h2>Chronos</h2>
        <button class="begin-btn" id="start-btn">Begin</button>
        <div class="loading-text hidden" id="start-loading">Generating your world...</div>
    </div>

    <div id="narrative" class="hidden">
        <div id="intro" class="intro"></div>
        <div id="turns"></div>
    </div>

    <div id="map-container" class="hidden"></div>
    <div id="map-hint" class="map-hint hidden">M to return</div>

    <div id="input-bar" class="hidden">
        <input type="text" id="player-input" placeholder="" autocomplete="off" disabled>
        <button id="act-btn" disabled>&rarr;</button>
    </div>

    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/examples/jsm/controls/OrbitControls.js": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js",
        "earcut": "https://cdn.jsdelivr.net/npm/earcut@3.0.1/src/earcut.js",
        "d3-geo": "https://cdn.jsdelivr.net/npm/d3-geo@3.1.1/+esm",
        "three-geojson-geometry": "https://cdn.jsdelivr.net/npm/three-geojson-geometry@1.3.2/dist/three-geojson-geometry.mjs"
      }
    }
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
