<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHRONOS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Georgia, "Times New Roman", serif;
            background: #0e0e0e;
            color: #c8b88a;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 14px 24px;
            border-bottom: 1px solid #282420;
            background: #121210;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1em;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #d8ccaa;
            font-weight: 400;
        }

        .era-line { font-size: 0.82em; color: #706850; margin-top: 3px; }

        .header-right { display: flex; gap: 10px; align-items: center; }

        .btn {
            background: #1e1c18;
            border: 1px solid #282420;
            color: #a09070;
            padding: 6px 14px;
            font-family: Georgia, serif;
            font-size: 0.82em;
            cursor: pointer;
            border-radius: 3px;
            transition: background 0.2s;
        }
        .btn:hover { background: #282420; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-primary { border-color: #3a3428; color: #c8b88a; }

        #narrative {
            flex: 1;
            overflow-y: auto;
            padding: 28px 24px;
            line-height: 1.7;
        }

        .intro p { margin-bottom: 12px; }

        .turn-block {
            margin-bottom: 24px;
            padding-top: 18px;
            border-top: 1px solid #1e1c18;
        }

        .turn-label {
            font-size: 0.72em;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #504830;
            margin-bottom: 8px;
        }

        .player-line { font-style: italic; color: #887858; margin-bottom: 10px; }
        .action-narration { margin-bottom: 12px; color: #b8a880; }

        .parsed-badge {
            display: inline-block;
            font-family: "SF Mono", "Fira Code", monospace;
            font-size: 0.72em;
            color: #585040;
            background: #161614;
            border: 1px solid #1e1c18;
            padding: 2px 8px;
            border-radius: 3px;
            margin-bottom: 12px;
        }

        .npc-block {
            margin-bottom: 12px;
            padding: 12px 16px;
            border-left: 2px solid #2a2620;
            background: #12110f;
        }

        .npc-label {
            font-size: 0.72em;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #706040;
            margin-bottom: 5px;
        }

        .npc-voice { line-height: 1.7; color: #c0b088; }

        .tension-line { font-size: 0.78em; color: #585040; margin-top: 8px; }
        .tension-high { color: #a07840; }
        .tension-critical { color: #b05030; }

        .death-block {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #3a2820;
            background: #1a1210;
            text-align: center;
        }
        .death-block p { color: #a08060; line-height: 1.8; }

        .erasure-block {
            margin: 40px auto;
            max-width: 500px;
            text-align: center;
            padding: 30px;
        }
        .erasure-block p { color: #706050; line-height: 2; font-style: italic; }

        .location-bar {
            padding: 8px 24px;
            background: #141412;
            border-bottom: 1px solid #1e1c18;
            font-size: 0.8em;
            color: #585040;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .location-bar .loc-name { color: #a09070; }
        .location-bar .nearby-label { color: #484030; }

        #input-bar {
            padding: 12px 24px;
            border-top: 1px solid #282420;
            background: #121210;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        #player-input {
            flex: 1;
            min-width: 200px;
            background: #181816;
            border: 1px solid #282420;
            color: #c8b88a;
            padding: 10px 14px;
            font-family: Georgia, serif;
            font-size: 0.95em;
            border-radius: 3px;
            outline: none;
        }
        #player-input:focus { border-color: #484030; }
        #player-input::placeholder { color: #3a3428; }

        .loading-text { color: #504830; font-style: italic; }
        .error-text { color: #a05040; }

        strong { color: #d0c090; font-weight: 600; }

        #start-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            gap: 20px;
        }
        #start-screen h2 {
            font-weight: 400;
            letter-spacing: 0.15em;
            color: #a09070;
        }
        #start-screen p { color: #585040; max-width: 400px; text-align: center; line-height: 1.7; }

        .travel-options {
            margin-top: 10px;
            font-size: 0.82em;
        }
        .travel-link {
            color: #706850;
            cursor: pointer;
            text-decoration: underline;
            text-decoration-color: #3a3428;
        }
        .travel-link:hover { color: #a09070; }

        .memory-indicator {
            font-size: 0.72em;
            color: #3a3428;
            margin-top: 6px;
        }

        .hidden { display: none; }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>Chronos</h1>
            <div class="era-line" id="era-info"></div>
        </div>
        <div class="header-right">
            <button class="btn" id="new-run-btn">New Run</button>
        </div>
    </header>

    <div id="start-screen">
        <h2>CHRONOS</h2>
        <p>A turn-based historical simulation. You will be assigned a random character in a random era. The world moves forward whether you act or not.</p>
        <button class="btn btn-primary" id="start-btn">Begin</button>
        <div class="loading-text hidden" id="start-loading">Generating your world...</div>
    </div>

    <div id="location-bar" class="location-bar hidden"></div>

    <div id="narrative" class="hidden">
        <div id="intro" class="intro"></div>
        <div id="turns"></div>
    </div>

    <div id="input-bar" class="hidden">
        <input type="text" id="player-input" placeholder="What do you do?" autocomplete="off" disabled>
        <button class="btn" id="act-btn" disabled>Act</button>
        <button class="btn" id="skip-btn" disabled>Skip</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
