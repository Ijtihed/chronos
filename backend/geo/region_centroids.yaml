# Centroids for historical event regions.
#
# Used by GET /api/run/{id}/events/visible to place events on the map.
# Region strings come from the historical_events table (231 distinct
# strings, 1,569 events). This file hand-maps the common ~50; compound
# and edge-case strings resolve via the centroids.py normalizer.
#
# Schema per entry:
#   lat, lon         — decimal degrees
#   radius_km        — approximate half-extent of the region; drives
#                      the event circle radius on the map
#   broad            — optional bool. When true (radius_km >= 1000),
#                      the frontend suppresses the pin at witnessed/
#                      known tiers and renders only the low-opacity
#                      circle. A pin at the geographic center of
#                      something as big as "Mediterranean" is
#                      meaningless; the circle signals "somewhere in
#                      this broad area" honestly.
#   note             — human note for era-sensitive or judgment-call
#                      entries. Not parsed.
#
# For era-ambiguous regions (Byzantine Empire, Italia/Italy, etc.)
# the centroid reflects the median territorial center. If future
# ingestion tags each event with a polity+year, revisit with
# era-keyed sub-entries.

# ───────────────────────────────────────────────────────────────────
# Top-tier coverage — broad or high-volume regions
# ───────────────────────────────────────────────────────────────────

Mediterranean:
  lat: 38.0
  lon: 18.0
  radius_km: 2000
  broad: true
  note: "Central basin; 429 events. Radius covers Iberia to Levant at ~2000km."

Byzantine Empire:
  lat: 39.0
  lon: 32.0
  radius_km: 1200
  broad: true
  note: "Centroid shifted inland from Constantinople to better cover territorial extent across the 1000-year span; still wrong for the 5th century but least-wrong overall."

